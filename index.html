<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Static Map Widget</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      color: #37352f;
      padding: 12px;
      margin: 0;
      box-sizing: border-box;
    }
    .widget-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 14px;
      background: #ffffff;
      max-width: 480px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 9px 12px;
      background: #007399;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #005a78; }
    #status {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
    #preview-container {
      margin-top: 12px;
      text-align: center;
    }
    #preview-img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #eaeaea;
      display: none;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="widget-card">
    <input type="text" id="addressInput" placeholder="Enter street address or city..." />
    <div class="btn-row">
      <button onclick="generateMap()">Generate & Download Map</button>
    </div>
    <div id="status"></div>
    <div id="preview-container">
      <img id="preview-img" alt="Generated Map" />
      <div id="hint" class="hint">Right-click (or drag) the image directly into your Notion page.</div>
    </div>
  </div>

  <script>
    const API_KEY = "934c009162214ab1ade7dece1f2a9b60";

    async function generateMap() {
      const address = document.getElementById("addressInput").value.trim();
      const status = document.getElementById("status");
      const img = document.getElementById("preview-img");
      const hint = document.getElementById("hint");

      if (!address) {
        status.innerText = "Please enter an address.";
        return;
      }

      status.innerText = "Locating address & rendering map...";
      img.style.display = "none";
      hint.style.display = "none";

      try {
        // 1. Geocode address
        const geoUrl = `https://api.geoapify.com/v1/geocode/search?text=${encodeURIComponent(address)}&apiKey=${API_KEY}`;
        const geoRes = await fetch(geoUrl);
        const geoData = await geoRes.json();

        if (!geoData.features || geoData.features.length === 0) {
          throw new Error("Address not found. Please refine search.");
        }

        const [lon, lat] = geoData.features[0].geometry.coordinates;

        // 2. Build properly URL-encoded static map query
        const styleRules = "landcover_grass:%230a3c32|landcover_wood:%235b280e|water:%2362828c|waterway:%2362828c|rail:%2346505a;6|rail_hatch:%2346505a;10|road_path:%23a0cac1|water_name_lakeline:%23ffffff|water_name_way:%23ffffff|water_name_sea:%23ffffff|water_name_ocean:%23ffffff|road_label_primary:%2346505a|road_label_secondary:%2346505a|place_label_park:%2346505a|place_label_village:%2346505a|place_label_city:%2346505a|place_label_town:%2346505a|place_label_state:%2346505a|place_label_country:%2346505a|place_label_continent:%2346505a";
        const mapUrl = `https://maps.geoapify.com/v1/staticmap?style=toner-grey&width=500&height=500&center=lonlat:${lon},${lat}&zoom=15&styleCustomization=${encodeURIComponent(styleRules)}&marker=lonlat:${lon},${lat};type:awesome;color:%23007399;size:24&scaleFactor=2&apiKey=${API_KEY}`;

        // 3. Fetch image as Blob and convert to object URL for reliable iframe preview
        const imgRes = await fetch(mapUrl);
        if (!imgRes.ok) throw new Error("Failed to render map image from server.");
        const blob = await imgRes.blob();
        const objectUrl = URL.createObjectURL(blob);

        img.src = objectUrl;
        img.style.display = "inline-block";
        hint.style.display = "block";

        // 4. Force browser file download to ~/Downloads
        const filename = `map-${address.replace(/[^a-zA-Z0-9]/g, "_")}.png`;
        const a = document.createElement("a");
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        status.innerText = `Downloaded: ${filename}`;
      } catch (err) {
        status.innerText = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
